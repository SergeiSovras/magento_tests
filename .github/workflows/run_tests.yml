name: Python autotests

on: 
  workflow_dispatch:
    inputs:
      deployment_target:
        description: Chose test set
        required: true
        type: choise
        default: smoke
        options:
          - smoke
          - regression
          - extended
          - all

jobs:
  run-tests:
    runs-on: ubuntu-latest
    name: Run autotests
    steps:
      - name: Checkout autotests
        uses: actions/checkout@v4
      - name: Setting up Python env
        uses: actions/setup-python@v4 
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: run tests
        run: pytest
